[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spt-classify"
version = "0.1.0"
description = "Motion-type classification for 3D single-particle tracking"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jagriti Chatterjee" }]
keywords = ["single-particle-tracking", "microscopy", "diffusion", "machine-learning"]
dependencies = ["numpy>=1.22", "scikit-learn>=1.2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/jagriti12/spt-classify"
Source = "https://github.com/jagriti12/spt-classify"
Paper = "https://doi.org/10.1021/cbmi.5c00057"

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
