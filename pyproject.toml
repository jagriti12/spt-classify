[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spt-classify"
version = "0.1.0"
description = "Motion-type classification for 3D single-particle tracking"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jagriti Chatterjee" }]
keywords = ["single-particle-tracking", "microscopy", "diffusion", "machine-learning"]
dependencies = ["numpy>=1.22", "scipy>=1.8", "scikit-learn>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
